<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <pattern id="hex" x="0" y="0" width="80" height="92" patternUnits="userSpaceOnUse">
      <polygon points="40,2 78,22 78,62 40,82 2,62 2,22" fill="none" stroke="#1E2A4A" stroke-width="1"/>
      <polygon points="40,46 78,66 78,106 40,126 2,106 2,66" fill="none" stroke="#1E2A4A" stroke-width="1"/>
      <polygon points="80,2 118,22 118,62 80,82 42,62 42,22" fill="none" stroke="#1E2A4A" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="#070B18"/>

  <!-- Hex grid -->
  <rect width="1500" height="500" fill="url(#hex)" opacity="0.7"/>

  <!-- Left cyan glow -->
  <rect width="600" height="500" fill="url(#glowLeft)"/>
  <!-- Right violet glow -->
  <rect x="900" width="600" height="500" fill="url(#glowRight)"/>

  <!-- Accent horizontal line -->
  <rect x="0" y="248" width="1500" height="2" fill="url(#accentLine)" opacity="0.6"/>

  <!-- Large background hex glyph (decorative) -->
  <polygon points="820,60 980,152 980,336 820,428 660,336 660,152"
           fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.2"/>
  <polygon points="820,100 940,168 940,304 820,372 700,304 700,168"
           fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.15"/>

  <!-- Quantum dot cluster (right side decoration) -->
  <circle cx="1300" cy="120" r="3" fill="#00D4FF" opacity="0.5"/>
  <circle cx="1340" cy="160" r="2" fill="#7C3AED" opacity="0.5"/>
  <circle cx="1260" cy="170" r="4" fill="#00D4FF" opacity="0.3"/>
  <circle cx="1380" cy="100" r="2" fill="#00D4FF" opacity="0.4"/>
  <circle cx="1320" cy="200" r="3" fill="#7C3AED" opacity="0.4"/>
  <line x1="1300" y1="120" x2="1340" y2="160" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>
  <line x1="1340" y1="160" x2="1320" y2="200" stroke="#7C3AED" stroke-width="0.5" opacity="0.3"/>
  <line x1="1260" y1="170" x2="1300" y2="120" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>
  <line x1="1380" y1="100" x2="1340" y2="160" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>

  <!-- === MAIN CONTENT === -->

  <!-- Hex logo glyph (small, left of title) -->
  <polygon points="122,195 156,215 156,255 122,275 88,255 88,215"
           fill="none" stroke="#00D4FF" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="122,209 147,224 147,253 122,268 97,253 97,224"
           fill="#00D4FF" opacity="0.15"/>
  <text x="122" y="243" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="28" font-weight="700" fill="#00D4FF" text-anchor="middle"
        letter-spacing="0">⬡</text>

  <!-- QVAULT wordmark -->
  <text x="176" y="263"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="80" font-weight="800" fill="#FFFFFF"
        letter-spacing="8">QVAULT</text>

  <!-- Cyan underline accent -->
  <rect x="176" y="275" width="450" height="3" fill="#00D4FF" rx="1.5"/>

  <!-- Tagline -->
  <text x="176" y="320"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="400" fill="#94A3B8"
        letter-spacing="1.5">BUILDING FINANCE FOR THE QUANTUM ERA</text>

  <!-- $QVLT pill -->
  <rect x="176" y="358" width="120" height="36" rx="18"
        fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.7"/>
  <text x="236" y="381"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="15" font-weight="600" fill="#00D4FF" text-anchor="middle"
        letter-spacing="1">$QVLT</text>

  <!-- Solana pill -->
  <rect x="310" y="358" width="120" height="36" rx="18"
        fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
  <text x="370" y="381"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="15" font-weight="600" fill="#A78BFA" text-anchor="middle"
        letter-spacing="1">SOLANA</text>

  <!-- Genesis launch badge (right area) -->
  <rect x="900" y="180" width="420" height="140" rx="12"
        fill="#0D1528" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="1110" y="230"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="500" fill="#64748B" text-anchor="middle"
        letter-spacing="3">GENESIS LAUNCH</text>
  <text x="1110" y="285"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="2">JUN 20</text>
  <rect x="960" y="297" width="300" height="2" fill="url(#accentLine)" rx="1"/>

  <!-- Bottom tagline -->
  <text x="750" y="460"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="400" fill="#334155" text-anchor="middle"
        letter-spacing="2">STAKE · VOTE · EARN · QUANTUM-SAFE</text>
</svg>
