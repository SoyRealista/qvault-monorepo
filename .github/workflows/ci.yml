name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# The Anchor contract build is intentionally NOT run in CI: it needs the Solana
# platform-tools + a current nightly and is validated locally (anchor build) and
# via the devnet test suite (contracts/tests). It will be covered by the
# professional audit before mainnet.

jobs:
  dapp:
    name: Build dApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web/app
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build
        working-directory: web/app
        run: npm run build

  social:
    name: Validate social bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: social
        run: npm install --no-audit --no-fund
      - name: Dry-run (validates queue + bot)
        working-directory: social
        run: npm run dry
